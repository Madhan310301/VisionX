openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: BrailleVision API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: braille
    description: Braille processing pipeline operations
  - name: scans
    description: Scan history management
  - name: tts
    description: Text-to-speech audio generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /braille/process:
    post:
      operationId: processBrailleImage
      tags: [braille]
      summary: Process a Braille image or video frame
      description: Classifies the Braille system then decodes with specialized rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrailleProcessInput"
      responses:
        "200":
          description: Processing result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrailleProcessResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /braille/correct:
    post:
      operationId: correctBrailleText
      tags: [braille]
      summary: Correct raw decoded Braille text using system-aware rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrailleCorrectionInput"
      responses:
        "200":
          description: Corrected text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrailleCorrectionResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /tts/synthesize:
    post:
      operationId: synthesizeSpeech
      tags: [tts]
      summary: Convert text to speech audio (returns base64 MP3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TtsInput"
      responses:
        "200":
          description: Audio data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TtsResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /scans:
    get:
      operationId: listScans
      tags: [scans]
      summary: List recent scans
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: List of scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"

    post:
      operationId: createScan
      tags: [scans]
      summary: Save a completed scan to history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "201":
          description: Created scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"

  /scans/stats:
    get:
      operationId: getScanStats
      tags: [scans]
      summary: Get aggregate scan statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStats"

  /scans/{id}:
    get:
      operationId: getScan
      tags: [scans]
      summary: Get a specific scan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      operationId: deleteScan
      tags: [scans]
      summary: Delete a scan from history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BrailleSystem:
      type: string
      description: |
        The classified Braille system detected in the image.
        ueb_grade1: Grade 1 — direct letter-by-letter.
        ueb_grade2: Grade 2 (contracted) — uses contractions like "the", "and", "ing". Used in USA, UK, Canada, Australia, India.
        nemeth: Nemeth Code for math, equations, and scientific notation.
        computer: Computer Braille for code, symbols, and programming characters.
        music: Music Braille for musical notation.
        unknown: Could not confidently classify.
      enum:
        - ueb_grade1
        - ueb_grade2
        - nemeth
        - computer
        - music
        - unknown

    BrailleProcessInput:
      type: object
      required:
        - imageBase64
        - mimeType
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data
        mimeType:
          type: string
          description: MIME type (image/jpeg, image/png, etc.)
        mode:
          type: string
          enum: [camera, upload, video]

    BrailleRegion:
      type: object
      required: [x, y, width, height, confidence]
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        confidence:
          type: number

    BrailleProcessResult:
      type: object
      required:
        - rawText
        - confidence
        - regions
        - lineCount
        - processingMs
        - brailleSystem
        - systemConfidence
      properties:
        rawText:
          type: string
        confidence:
          type: number
        brailleSystem:
          $ref: "#/components/schemas/BrailleSystem"
        systemConfidence:
          type: number
          description: Confidence in the system classification 0-1
        systemReasoning:
          type: string
          description: Brief explanation of why this system was detected
        regions:
          type: array
          items:
            $ref: "#/components/schemas/BrailleRegion"
        debugDots:
          type: array
          items:
            $ref: "#/components/schemas/BrailleDot"
        lineCount:
          type: integer
        processingMs:
          type: integer
        warnings:
          type: array
          items:
            type: string

    BrailleDot:
      type: object
      required: [x, y, radius]
      properties:
        x:
          type: number
        y:
          type: number
        radius:
          type: number
        confidence:
          type: number

    BrailleCorrectionInput:
      type: object
      required:
        - rawText
      properties:
        rawText:
          type: string
        brailleSystem:
          $ref: "#/components/schemas/BrailleSystem"

    BrailleCorrectionResult:
      type: object
      required:
        - correctedText
        - changesApplied
      properties:
        correctedText:
          type: string
        changesApplied:
          type: integer

    TtsInput:
      type: object
      required:
        - text
      properties:
        text:
          type: string
        voice:
          type: string
          enum: [alloy, echo, fable, onyx, nova, shimmer]

    TtsResult:
      type: object
      required:
        - audioBase64
        - format
      properties:
        audioBase64:
          type: string
        format:
          type: string

    Scan:
      type: object
      required:
        - id
        - createdAt
        - mode
        - rawText
        - correctedText
        - confidence
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        mode:
          type: string
          enum: [camera, upload, video]
        rawText:
          type: string
        correctedText:
          type: string
        confidence:
          type: number
        lineCount:
          type: ["integer", "null"]
        brailleSystem:
          oneOf:
            - $ref: "#/components/schemas/BrailleSystem"
            - type: "null"
        exportedAt:
          type: ["string", "null"]
          format: date-time

    ScanInput:
      type: object
      required:
        - mode
        - rawText
        - correctedText
        - confidence
      properties:
        mode:
          type: string
          enum: [camera, upload, video]
        rawText:
          type: string
        correctedText:
          type: string
        confidence:
          type: number
        lineCount:
          type: ["integer", "null"]
        brailleSystem:
          oneOf:
            - $ref: "#/components/schemas/BrailleSystem"
            - type: "null"

    ScanStats:
      type: object
      required:
        - totalScans
        - avgConfidence
        - byMode
      properties:
        totalScans:
          type: integer
        avgConfidence:
          type: number
        byMode:
          type: object
          properties:
            camera:
              type: integer
            upload:
              type: integer
            video:
              type: integer
        bySystem:
          type: object
          properties:
            ueb_grade1:
              type: integer
            ueb_grade2:
              type: integer
            nemeth:
              type: integer
            computer:
              type: integer
            music:
              type: integer
            unknown:
              type: integer

    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
